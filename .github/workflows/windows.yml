# D Studio CI: unit tests (Linux + Windows), real-desktop E2E recordings on
# windows-latest, GUI screenshots in both languages, the Windows installer +
# portable zip, and a silent install with the installed self-test.
name: windows

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  DSTUDIO_LANG: en

jobs:
  unit-ubuntu:
    name: unit tests (ubuntu, pure-Python parts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: System packages (ffmpeg, Xvfb for Tk)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg xvfb xauth

      - name: Python packages
        run: python -m pip install numpy pillow pyyaml

      - name: Unit tests
        env:
          DSTUDIO_SETTINGS: ${{ runner.temp }}/dstudio-settings.json
          DSTUDIO_DATA_DIR: ${{ runner.temp }}/dstudio-data
        run: xvfb-run -a python tests_windows/run_unit.py --report artifacts/unit-ubuntu.json

      - name: Upload unit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-ubuntu
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: windows (tests, E2E, installer)
    runs-on: windows-latest
    timeout-minutes: 110
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64

      - name: Cache pinned downloads (Python, FFmpeg)
        uses: actions/cache@v5
        with:
          path: build-cache
          key: dstudio-downloads-${{ hashFiles('installer/pins.json') }}

      - name: Python packages
        run: python -m pip install -r requirements.txt pillow pyyaml

      - name: FFmpeg (same pinned build as the installer)
        run: |
          ./installer/get_ffmpeg.ps1 -Dest "$env:RUNNER_TEMP\ffmpeg" -CacheDir build-cache
          "$env:RUNNER_TEMP\ffmpeg" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "DSTUDIO_FFMPEG=$env:RUNNER_TEMP\ffmpeg\ffmpeg.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Desktop / capture environment (resolution, DXGI duplication, gdigrab)
        run: python tests_windows/env_report.py --out artifacts/env

      - name: Unit tests
        id: unit
        continue-on-error: true
        env:
          DSTUDIO_SETTINGS: ${{ runner.temp }}\unit-settings.json
          DSTUDIO_DATA_DIR: ${{ runner.temp }}\unit-data
        run: python tests_windows/run_unit.py --report artifacts/unit-windows.json

      - name: GUI screenshots (English + Chinese)
        id: screens
        continue-on-error: true
        timeout-minutes: 15
        run: python tests_windows/gui_screenshots.py --out artifacts/screenshots

      # desktop30, fps60, app_only, pause_resume, export + v0.2.1: mask_transition
      # (maximize/restore/minimize over a red canary), crash_safety (TerminateProcess,
      # then package), display_encoder (primary monitor only, libx264)
      - name: E2E recordings on the real desktop
        id: e2e
        continue-on-error: true
        timeout-minutes: 50
        env:
          DSTUDIO_ENV_REPORT: ${{ github.workspace }}\artifacts\env\env.json
        run: python tests_windows/run_all.py --out artifacts/e2e

      - name: Build installer + portable zip
        id: build
        timeout-minutes: 30
        run: ./installer/build_windows.ps1 -OutDir dist -CacheDir build-cache

      # also records 3 s with the INSTALLED python + packages, then packages and validates it
      - name: Silent install + installed self-test + recording + uninstall
        id: installed
        timeout-minutes: 30
        env:
          DSTUDIO_ENV_REPORT: ${{ github.workspace }}\artifacts\env\env.json
        run: python tests_windows/installed_check.py --dist dist --out artifacts/installed

      - name: Collect a few decoded frames for review
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/frames | Out-Null
          Get-ChildItem -Path artifacts/e2e -Recurse -Filter *.png -ErrorAction SilentlyContinue |
            Select-Object -First 40 | ForEach-Object {
              Copy-Item $_.FullName (Join-Path artifacts/frames ($_.Directory.Parent.Name + '-' + $_.Name)) -Force
            }
          if (Test-Path dist/selftest-stage.json) { Copy-Item dist/selftest-stage.json artifacts/ -Force }
          if (Test-Path dist/build-info.json) { Copy-Item dist/build-info.json artifacts/ -Force }

      - name: Upload test results (reports, screenshots, frames, small datasets)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dstudio-windows-test-results
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if a test step failed
        if: always()
        env:
          UNIT: ${{ steps.unit.outcome }}
          SCREENS: ${{ steps.screens.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          $bad = @()
          if ($env:UNIT -eq 'failure') { $bad += 'unit tests' }
          if ($env:SCREENS -eq 'failure') { $bad += 'GUI screenshots' }
          if ($env:E2E -eq 'failure') { $bad += 'E2E recordings' }
          if ($bad.Count -gt 0) {
            Write-Host "::error::Failed: $($bad -join ', ') (see the dstudio-windows-test-results artifact)"
            exit 1
          }
          Write-Host 'unit / screenshots / E2E all passed'
